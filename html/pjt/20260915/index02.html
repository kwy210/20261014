<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>INDEX02</title>
</head>
<body>

    <!-- 공간 분할 태그 :: div (오직 가로로만 공간 분할 가능) -->
    <div>
        여기는 네이버 Header 공간 이에요 <hr> <br>
    </div> 
    <div>
        여기는 네이버 search 공간 이에요 <hr>  <br>
    </div> 
    <div>
        여기는 네이버 GNB(Global Navigation Bar) 공간 이에요 <hr> <br>
    </div> 

    <!-- 공간 분할 태그 :: 시멘틱 ( 이름만 보고도 그 안에 담긴 
        콘텐츠의 역할과 의미를 명확히 알 수 있는 HTML 태그 )  -->
    <header>
        여기는 네이버 header 에요
    </header>

    <search>
        여기는 네이버 search 에요
    </search>

    <!-- 시멘틱 테그 종류 -->

    <!--<header>: 페이지나 영역의 상단 머릿글 (로고, 사이트 제목 등)
        <nav>: 다른 페이지나 링크로 이동하는 내비게이션 메뉴
        <main>: 문서의 핵심이 되는 주요 콘텐츠 내용
        <section>: 주제별로 콘텐츠를 묶는 구역 단위
        <article>: 독립적으로 구분되거나 재사용 가능한 글 콘텐츠 (뉴스 기사, 블로그 포스트 등)
        <aside>: 본문 외의 부가적인 내용 (사이드바, 광고 등)
        <footer>: 페이지나 영역의 하단 바닥글 (저작권, 연락처 정보 등) -->
