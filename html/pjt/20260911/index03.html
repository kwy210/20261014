<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index03</title>
</head>
<body>
    <!-- 목록 (리스트) ul (불릿) , ol (숫자) , li 3가지 테그를 사용-->
     <!-- https://hoazzinews.tistory.com/92 -->
    <ul>
        <li>짜장면</li>
        <li>짬뽕</li>
        <li>우동</li>
        <li>탕수육</li>
    </ul>
    <ol>
        <li>짜장면</li>
        <li>짬뽕</li>
        <li>우동</li>
        <li>탕수육</li>
    </ol>

    <!-- dl , dt, dd -->

    <dl>
        <dt>html</dt>

        <dd>웹 문서를 구조화하는 마크업 언어</dd>

        <dt>css</dt>

        <dd>웹 문서의 디자인을 담당하는 스타일 시트</dd>
    </dl>
</body>
</html>
