<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index04</title>
</head>
<body>
    <!-- <form>(양식태그): 사용자 입력을 모아 서버에 전송하는 입력 양식의 컨테이너 -->
    <!--<input>은 다양한 형태의 입력 필드를 만드는 데 사용되며, type 속성으로 형태를 지정합니다.  -->
    <!-- https://hoazzinews.tistory.com/93 -->
     <!-- (client -> request -> server -> response -> client) -->
     <!-- Get 방식은 
      https://search.naver.com/search.naver?
      where=nexearch
      &sm=top_sug.pre
      &fbm=0
      &acr=1
      &acq=wea
      &qdt=0
      &ie=utf8
      &query=weather
      &ackey=natd515a 도메인 노출 -->
      <!-- 위에 주소는 &을 기준으로 어떻게 처리한건지 알기쉽게 나눈것 -->
      Post 방식은 클라이언트 에서 서버로 requset 되는 과정에 같이 들어가는 방식
      
      <!--남이 보면 안된다(로그인,회원가입 등등) Post, 남이보든 상관없다 Get (Get 방식은 첨부파일이 
       포함되어 있다면 전송 불가)-->
    <form
    action="서버URL"
    method="post">
     <input  type="text" placeholder="회원 id 입력해주세요"><br>
     <input  type="password" placeholder="회원 pw 입력해주세요"><br>
     <input  type="email" placeholder="회원 email 입력해주세요"><br>
     <input  type="number" placeholder="회원 AGE 입력하세요"?>
     <input  type="file"><br>
     <input  type="date"><br>
     <input  type="datetime-local"><br>
     <select>
        <option>한국</option>
        <option>미국</option>
        <option>영국</option>
        <option>일본</option>
        <option>중국</option>
     </select><br>
     <input type="checkbox" name="hobby">축구
     <input type="checkbox" name="hobby">>농구
     <input type="checkbox" name="hobby">>배구
     <input type="checkbox" name="hobby">>수구
     <input type="checkbox" name="hobby">>탁구
     <br>
     <input type="radio" name="gender">남자
     <input type="radio" name="gender">여자
     <br>
     <input type="color"><br>
     <input type="range" max="10" min="0" step="2" value="2"><br>
     <input type="button" value="회원가입"><
     <input type="reset" value="초기화">
      </form>      
</body>
</html>
